<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Launcher LoL Idle — até 5 contas do LoL Idle numa janela, leve e 100% local">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset=".6" stop-color="#0e1420"/>
      <stop offset="1" stop-color="#0a1a1f"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx=".2" cy=".45" r=".45">
      <stop offset="0" stop-color="#0ac8b9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0ac8b9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx=".82" cy=".25" r=".45">
      <stop offset="0" stop-color="#c8aa6e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c8aa6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e6d2"/>
      <stop offset="1" stop-color="#c8aa6e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a202c"/>
      <stop offset="1" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16301f"/>
      <stop offset=".5" stop-color="#1f3a22"/>
      <stop offset="1" stop-color="#2a2318"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ac8b9"/>
      <stop offset="1" stop-color="#5ee7dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glowTeal)"/>
  <rect width="1280" height="400" fill="url(#glowGold)"/>

  <!-- marca hextech -->
  <g transform="translate(96 118)">
    <rect x="-30" y="-30" width="60" height="60" rx="10" transform="rotate(45)" fill="#0d1118" stroke="#c8aa6e" stroke-width="3"/>
    <rect x="-13" y="-13" width="26" height="26" rx="3" transform="rotate(45)" fill="#0ac8b9"/>
  </g>
  <text x="150" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="700" fill="url(#gold)" letter-spacing=".5">LoL Idle</text>
  <text x="152" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#9aa3b2" letter-spacing="5">LAUNCHER</text>

  <text x="64" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#eef1f6">Até 5 contas numa janela só.</text>
  <text x="64" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#9aa3b2">Nível, XP/h e tarefas de cada conta · calculadora de build</text>
  <text x="64" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#9aa3b2">com as fórmulas do jogo · radar do mercado · modo leve</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="64" y="300" width="118" height="30" rx="15" fill="#0ac8b9" fill-opacity=".14" stroke="#0ac8b9" stroke-opacity=".45"/>
    <text x="123" y="320" text-anchor="middle" fill="#5ee7dc">100% local</text>
    <rect x="192" y="300" width="132" height="30" rx="15" fill="#c8aa6e" fill-opacity=".12" stroke="#c8aa6e" stroke-opacity=".45"/>
    <text x="258" y="320" text-anchor="middle" fill="#f0e6d2">sem automação</text>
    <rect x="334" y="300" width="118" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="393" y="320" text-anchor="middle" fill="#cfd5df">open-source</text>
  </g>

  <!-- janela ilustrativa -->
  <g transform="translate(610 44)" filter="url(#shadow)">
    <rect width="620" height="312" rx="14" fill="#0b0d12" stroke="#ffffff" stroke-opacity=".1"/>
    <rect width="620" height="34" rx="14" fill="#0f1219"/>
    <rect y="20" width="620" height="14" fill="#0f1219"/>
    <rect x="14" y="10" width="14" height="14" rx="3" transform="rotate(45 21 17)" fill="none" stroke="#c8aa6e" stroke-width="1.5"/>
    <text x="38" y="22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0e6d2">LoL Idle</text>
    <rect x="96" y="9" width="96" height="16" rx="5" fill="#1a202c"/>
    <rect x="152" y="10" width="18" height="14" rx="4" fill="#c8aa6e"/>
    <text x="214" y="21" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#eef1f6">15.2M <tspan fill="#626b7a" font-weight="400">XP/h</tspan></text>
    <text x="290" y="21" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#c8aa6e">1 <tspan fill="#626b7a" font-weight="400">tarefa pronta</tspan></text>
    <text x="392" y="21" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#eef1f6">1.0 GB</text>

    <!-- conta principal -->
    <g transform="translate(10 44)">
      <rect width="340" height="258" rx="9" fill="url(#card)" stroke="#c8aa6e" stroke-opacity=".25"/>
      <circle cx="14" cy="15" r="4" fill="#3ecf8e"/>
      <text x="25" y="19" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#eef1f6">Principal</text>
      <rect x="86" y="7" width="40" height="16" rx="4" fill="#232a38"/><text x="106" y="19" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#9aa3b2">Yasuo</text>
      <rect x="130" y="7" width="38" height="16" rx="4" fill="#c8aa6e" fill-opacity=".18"/><text x="149" y="19" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" fill="#f0e6d2">Nv 62</text>
      <rect x="176" y="13" width="44" height="4" rx="2" fill="#232a38"/><rect x="176" y="13" width="28" height="4" rx="2" fill="url(#xp)"/>
      <text x="228" y="19" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" fill="#eef1f6">9.8M/h</text>
      <rect x="0" y="30" width="340" height="228" fill="url(#map)"/>
      <path d="M20 250 L20 60 Q20 40 40 40 L320 40" fill="none" stroke="#8a6d3b" stroke-opacity=".7" stroke-width="10"/>
      <path d="M30 240 L320 50" fill="none" stroke="#8a6d3b" stroke-opacity=".55" stroke-width="9"/>
      <path d="M40 160 Q120 120 170 150 T320 120" fill="none" stroke="#2f6f9a" stroke-opacity=".7" stroke-width="7"/>
      <circle cx="300" cy="62" r="34" fill="#7a2730" fill-opacity=".6"/>
      <circle cx="44" cy="232" r="34" fill="#23466e" fill-opacity=".65"/>
      <g transform="translate(160 150)"><circle r="9" fill="#0ac8b9" fill-opacity=".35"/><circle r="4" fill="#5ee7dc"/></g>
    </g>
    <!-- alts -->
    <g transform="translate(360 44)">
      <rect width="250" height="124" rx="9" fill="url(#card)" stroke="#c8aa6e" stroke-width="1.5"/>
      <circle cx="14" cy="15" r="4" fill="#3ecf8e"/>
      <text x="25" y="19" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#eef1f6">Alt 1</text>
      <rect x="62" y="7" width="38" height="16" rx="4" fill="#c8aa6e" fill-opacity=".18"/><text x="81" y="19" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" fill="#f0e6d2">Nv 48</text>
      <rect x="164" y="7" width="78" height="16" rx="4" fill="#c8aa6e"/><text x="203" y="19" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" fill="#13100a">Tarefa pronta</text>
      <rect x="0" y="30" width="250" height="94" fill="url(#map)"/>
      <path d="M10 118 L240 40" fill="none" stroke="#8a6d3b" stroke-opacity=".55" stroke-width="7"/>
      <circle cx="226" cy="50" r="20" fill="#7a2730" fill-opacity=".55"/>
    </g>
    <g transform="translate(360 178)">
      <rect width="250" height="124" rx="9" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
      <circle cx="14" cy="15" r="4" fill="#3ecf8e"/>
      <text x="25" y="19" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#eef1f6">Alt 2</text>
      <rect x="62" y="7" width="38" height="16" rx="4" fill="#c8aa6e" fill-opacity=".18"/><text x="81" y="19" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" fill="#f0e6d2">Nv 35</text>
      <rect x="108" y="13" width="44" height="4" rx="2" fill="#232a38"/><rect x="108" y="13" width="39" height="4" rx="2" fill="url(#xp)"/>
      <rect x="0" y="30" width="250" height="94" fill="url(#map)"/>
      <path d="M30 40 Q110 90 240 70" fill="none" stroke="#2f6f9a" stroke-opacity=".7" stroke-width="6"/>
      <circle cx="30" cy="110" r="20" fill="#23466e" fill-opacity=".6"/>
    </g>
  </g>
</svg>
